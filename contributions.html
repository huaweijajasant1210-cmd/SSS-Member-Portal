<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contributions</title>

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:"Montserrat",sans-serif;

    background:#eef6fc;

    color:#444;

    overflow-x:hidden;
}


/* =====================================================
   STICKY HEADER
===================================================== */

.sticky-header{

    position:sticky;

    top:0;

    z-index:9999;

    background:white;
}


/* =====================================================
   TOP HEADER
===================================================== */

.dashboard-header{

    height:75px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;

    box-shadow:0 2px 8px #ddd;

}


.menu-icon{

    border:none;

    background:none;

    font-size:32px;

    color:#285a9c;

    cursor:pointer;

}


.dashboard-actions{

    display:flex;

    align-items:center;

    gap:25px;

    font-size:28px;

    color:#285a9c;

}


.profile-icon{

    width:55px;

    height:55px;

    border-radius:50%;

    background:#ddd;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.profile-icon img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* =====================================================
   MEMBER INFO HEADER
===================================================== */

.member-info{

    background:white;

    padding:15px 25px 17px;

    box-shadow:0 3px 8px #ccc;

}


.member-name{

    font-size:20px;

    font-weight:400;

}


.member-number{

    font-size:18px;

    margin-top:5px;

}


.member-date{

    margin-top:10px;

    font-size:17px;

    color:#315a9c;

}


/* =====================================================
   FLOATING CALENDAR
===================================================== */

.calendar{

    position:fixed;

    right:0;

    top:365px;

    background:#b9dcff;

    padding:25px 18px;

    border-radius:20px 0 0 20px;

    font-size:38px;

    color:#285a9c;

    z-index:500;

    opacity:.9;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.main-content{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:20px 20px 80px;
}


/* =====================================================
   MEMBER TITLE
===================================================== */

.member-title{

    font-size:21px;

    margin:10px 0 18px;

    color:#555;

}


.member-title span{

    color:#333;

}


/* =====================================================
   MEMBER DETAILS CARD
===================================================== */

.member-details{

    background:white;

    border-radius:9px;

    overflow:hidden;

    box-shadow:0 2px 8px rgba(0,0,0,.14);

    margin-bottom:35px;

}


/* COVER */

.cover{

    height:210px;

    background:
    linear-gradient(
        120deg,
        #a9d8f3 0%,
        #5eaddd 35%,
        #3396d0 70%,
        #2782b7 100%
    );

    position:relative;

    overflow:hidden;

}


/* diagonal design */

.cover::before{

    content:"";

    position:absolute;

    width:180px;

    height:300px;

    left:70px;

    top:-30px;

    background:rgba(255,255,255,.18);

    transform:skewX(-30deg);

}


.cover::after{

    content:"";

    position:absolute;

    width:180px;

    height:300px;

    right:80px;

    top:-30px;

    background:rgba(255,255,255,.12);

    transform:skewX(-30deg);

}


/* AVATAR */

.avatar{

    width:140px;

    height:140px;

    border-radius:50%;

    background:#55a9df;

    border:7px solid white;

    position:relative;

    margin:-70px auto 0;

    z-index:10;

    overflow:hidden;

}


.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* MEMBER CARD CONTENT */

.member-details h2{

    text-align:center;

    font-size:29px;

    font-weight:400;

    margin:30px 20px 25px;

}


.member-details p{

    text-align:center;

    font-size:18px;

    color:#777;

    line-height:1.55;

    margin:15px 20px;

}


.member-details p i{

    color:#777;

    margin-right:7px;

}


/* =====================================================
   MEMBER DROPDOWN
===================================================== */

.member-dropdown{

    width:100%;

    border:none;

    background:#3159a2;

    color:white;

    padding:15px;

    border-radius:8px;
