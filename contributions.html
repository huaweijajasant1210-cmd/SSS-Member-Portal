<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Contributions</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #3f3f3f;
        }

        /* =========================
           HEADER
        ========================= */

        .top-header {
            height: 92px;
            background: #ffffff;
            border-bottom: 1px solid #d8dee5;
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hamburger {
            font-size: 34px;
            color: #315a9b;
            margin-right: auto;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .notification {
            font-size: 34px;
            color: #315a9b;
        }

        .profile {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
        }


        /* =========================
           MEMBER INFORMATION
        ========================= */

        .member-header {
            background: #ffffff;
            padding: 20px 25px 25px;
            border-bottom: 1px solid #d9dfe6;
        }

        .member-name {
            font-size: 22px;
            margin-bottom: 8px;
            color: #333333;
        }

        .member-number {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .datetime {
            font-size: 19px;
            color: #315a9b;
        }

        .datetime i {
            margin-right: 7px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 94%;
            max-width: 850px;
            margin: 25px auto;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .summary-title {
            text-align: center;
            background: #edf0f3;
            padding: 9px;
            border-radius: 6px;
            font-size: 21px;
            color: #5d6268;
            margin-bottom: 25px;
        }

        .summary-item {
            margin-bottom: 22px;
        }

        .summary-label {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 25px;
            color: #333333;
        }


        /* =========================
           YEAR NAVIGATION
        ========================= */

        .year-navigation {
            background: #dff1fc;
            border-radius: 5px 5px 0 0;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .year {
            font-size: 23px;
            color: #526b82;
            font-weight: 500;
        }

        .year-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            font-size: 48px;
            color: #315a9b;

            cursor: pointer;
            z-index: 10;
        }

        .year-btn:hover {
            color: #1d467f;
        }

        .previous-year {
            left: -55px;
        }

        .next-year {
            right: -55px;
        }


        /* =========================
           CONTRIBUTION TABLE
        ========================= */

        .table-wrapper {
            background: #ffffff;
            padding: 0 0 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 20px;
        }

        th {
            background: #ffffff;
            color: #526b82;
            font-weight: 500;
            padding: 14px;
            border: 1px solid #ffffff;
        }

        td {
            padding: 13px 20px;
            border: 1px solid #ffffff;
        }

        td.month {
            width: 35%;
            background: #a9d3ed;
            text-align: center;
            color: #34495e;
        }

        td.amount {
            width: 65%;
            background: #fafafa;
            text-align: right;
            color: #333333;
        }
