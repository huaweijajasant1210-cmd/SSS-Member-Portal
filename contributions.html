<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contributions - Member Portal Demo</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eaf5fb;
    color: #333;
    overflow-x: hidden;
}


/* =====================================================
   STICKY HEADER
===================================================== */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 9999;
    background: #f7f7fb;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.topbar {
    height: 64px;
    background: #071616;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    position: relative;
}


/* HAMBURGER */

.menu-button {
    width: 45px;
    height: 45px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;

    cursor: pointer;
}

.menu-button span {
    width: 30px;
    height: 4px;

    background: #3159a2;
    border-radius: 3px;
}


/* RIGHT ICONS */

.top-right {
    display: flex;
    align-items: center;
    gap: 22px;
}

.notification {
    font-size: 28px;
    color: #3159a2;
}

.profile-small {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #4aa5df;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;

    border: 3px solid #fff;

    overflow: hidden;
}


/* =====================================================
   MEMBER HEADER
===================================================== */

.member-header {
    background: #ffffff;

    padding: 15px 25px 17px;

    border-bottom: 1px solid #ddd;

    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

.member-name {
    font-size: 20px;
    font-weight: 400;

    margin-bottom: 5px;
}

.member-number {
    font-size: 17px;

    margin-bottom: 9px;
}

.member-date {
    color: #31558e;

    font-size: 17px;

    display: flex;
    align-items: center;
    gap: 7px;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.page-container {
    width: 100%;
    max-width: 1000px;

    margin: 0 auto;

    padding: 28px 20px 80px;
}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb {
    font-size: 21px;

    margin-bottom: 20px;

    color: #333;
}

.breadcrumb span {
    color: #999;
}


/* =====================================================
   CONTRIBUTION MAIN CARD
===================================================== */

.contribution-card {
    background: #ffffff;

    border-radius: 9px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.10);

    padding: 30px 25px 35px;

    width: 100%;

    position: relative;
}


/* =====================================================
   YEAR NAVIGATION
===================================================== */

.year-navigation {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
}

.year-arrow {
    width: 55px;
    height: 55px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 50px;
    font-weight: 200;

    color: #3159a2;

    cursor: pointer;

    user-select: none;
}

.year-arrow:hover {
    opacity: 0.7;
}

.year-title {
    flex: 1;

    text-align: center;

    background: #dff1fb;

    color: #5b6b78;

    padding: 12px;

    font-size: 22px;

    letter-spacing: 1px;
}


/* =====================================================
   TABLE
===================================================== */

.table-container {
    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

.contribution-table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}

.contribution-table th {
    background: #a9d5ed;

    color: #526777;

    font-size: 18px;

    font-weight: 400;

    letter-spacing: 1px;

    padding: 15px 10px;

    border-right: 1px solid #e7f3f9;
}

.contribution-table th:first-child {
    width: 34%;
}

.contribution-table th:last-child {
    width: 66%;
}

.contribution-table td {
    padding: 13px 12px;

    font-size: 20px;

    border-bottom: 1px solid #e5e5e5;

    height: 66px;
}

.contribution-table td:first-child {
    background: #a9d5ed;

    text-align: center;

    color: #344b5d;

    border-right: 1px solid #ffffff;
}

.contribution-table td:last-child {
    text-align: right;

    padding-right: 18px;

    color: #333;

    background: #fafcfd;
}
