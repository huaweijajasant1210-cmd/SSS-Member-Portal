<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyPortal Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef4f9;
    min-height:100vh;
}


/* HEADER */

.header{
    height:90px;
    background:#285aa6;
    color:white;
    display:flex;
    align-items:center;
    padding:0 35px;
}

.logo{
    width:55px;
    height:55px;
    object-fit:contain;
    margin-right:20px;
}

.header h1{
    font-size:32px;
}


/* LAYOUT */

.container{
    display:flex;
    min-height:calc(100vh - 90px);
}


/* SIDEBAR */

.sidebar{

    width:260px;
    background:white;
    padding:30px 20px;
    box-shadow:2px 0 10px #ddd;

}


.menu{

    padding:18px;
    margin-bottom:10px;
    border-radius:10px;
    font-size:20px;
    color:#285aa6;
    cursor:pointer;

}


.menu:hover{

    background:#e6f0ff;

}


/* CONTENT */

.content{

    flex:1;
    padding:40px;

}


.title{

    font-size:38px;
    color:#222;
    margin-bottom:30px;

}


/* CARDS */

.cards{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;

}


.card{

    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px #ddd;

}


.card h2{

    color:#285aa6;
    margin-bottom:15px;

}


.card p{

    font-size:22px;

}


/* MOBILE */

@media(max-width:700px){

.container{

    flex-direction:column;

}


.sidebar{

    width:100%;
    display:flex;
    overflow:auto;

}


.menu{

    min-width:150px;
    text-align:center;

}


.content{

    padding:25px;

}


.cards{

    grid-template-columns:1fr;

}


.header h1{

    font-size:24px;

}

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <img src="logo.png" class="logo">

    <h1>MyPortal Dashboard</h1>

</div>



<div class="container">


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="menu">
        🏠 Dashboard
    </div>

    <div class="menu">
        💳 Loans
    </div>

    <div class="menu">
        🎁 Benefits
    </div>

    <div class="menu">
        📄 Contributions
    </div>

    <div class="menu">
        ⚙ Settings
    </div>


</div>



<!-- MAIN -->

<div class="content">


<h1 class="title">
    Welcome, Member!
</h1>



<div class="cards">


<div class="card">

<h2>Member Status</h2>

<p>
Active Member
</p>

</div>



<div class="card">

<h2>Contributions</h2>

<p>
₱25,000.00
</p>

</div>



<div class="card">

<h2>Available Loan</h2>

<p>
₱50,000.00
</p>

</div>


</div>


</div>


</div>


</body>
</html>
