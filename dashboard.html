<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSS Dashboard Mockup</title>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #eaf4fb;
    color: #202020;
}

/* =========================
   TOP HEADER
========================= */

.header {
    height: 76px;
    background: #ffffff;
    border-bottom: 1px solid #d7dce2;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    position: sticky;
    top: 0;
    z-index: 20;
}

.menu {
    font-size: 32px;
    color: #315a9c;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.bell {
    font-size: 30px;
    color: #315a9c;
}

.profile {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #dbeeff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px #999;
}

.profile i {
    font-size: 32px;
    color: #3b67a5;
}

/* =========================
   USER INFORMATION
========================= */

.user-info {
    background: #ffffff;
    padding: 17px 26px 18px;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
}

.user-name {
    font-size: 19px;
    font-weight: 400;
    margin-bottom: 7px;
}

.sss-number {
    font-size: 18px;
    margin-bottom: 8px;
}

.date {
    color: #3d6199;
    font-size: 17px;
}

.date i {
    margin-right: 7px;
}

/* =========================
   MAIN
========================= */

.container {
    width: 94%;
    max-width: 720px;
    margin: 18px auto 40px;
}

/* =========================
   CARD
========================= */

.card {
    background: #ffffff;
    border-radius: 10px;
    margin-bottom: 16px;
    padding: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    overflow: hidden;
}

.card-title {
    display: flex;
    align-items: center;
    gap: 15px;

    font-size: 29px;
    font-weight: 400;

    margin-bottom: 22px;
}

.title-icon {
    width: 65px;
    height: 65px;

    background: #e5f9fb;
    color: #176fa4;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 31px;
}

/* =========================
   IMAGE PANEL
========================= */

.image-panel {
    width: 100%;
    height: 250px;

    border-radius: 10px;

    background:
        linear-gradient(
            rgba(190,230,245,.15),
            rgba(210,240,250,.65)
        ),
        url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=80");

    background-size: cover;
    background-position: center;

    margin-bottom: 25px;
}

/* =========================
   CONTRIBUTIONS
========================= */

.amount {
    font-size: 32px;
    font-weight: 400;
    margin-bottom: 5px;
}

.amount-label {
    font-size: 19px;
    margin-bottom: 28px;
}

.contribution-row {
    display: flex;
    align-items: center;
    gap: 15px;
}

.number-box {
    width: 65px;
    height: 65px;

    border-radius: 10px;

    background: #d8f5ee;
    border: 3px solid #a9ded3;

    color: #27977a;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
}

.contribution-text {
    color: #3d977e;
    font-size: 18px;
    line-height: 1.5;
}

.contribution-text small {
    display: block;
    color: #777;
    font-size: 15px;
}

/* =========================
   BUTTON
========================= */

.btn {
    display: inline-block;

    background: #315a9c;
    color: white;

    border: none;
    border-radius: 5px;

    padding: 15px 24px;

    font-family: inherit;
    font-size: 17px;

    float: right;

    margin-top: -65px;
}

/* =========================
   INFO BOX
========================= */

.info-box {
    background: #cef5fa;
    border-radius: 10px;

    padding: 20px;

    color: #256679;

    font-size: 17px;
    line-height: 1.6;

    margin-top: 25px;
}

.info-box i {
    margin-right: 8px;
}

.link {
    color: #1878d1;
    font-weight: 500;
}

/* =========================
   SERVICES
========================= */

.services {
    margin-top: 15px;
}

.service {
    display: flex;
    align-items: center;

    gap: 20px;

    padding: 18px 5px;

    border-bottom: 1px solid #ddd;

    color: #345d98;

    font-size: 20px;
}

.service:last-child {
    border-bottom: none;
}

.service i {
    width: 30px;
    text-align: center;
    font-size: 20px;
}
